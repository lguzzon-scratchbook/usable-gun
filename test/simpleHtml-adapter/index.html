<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>usable-gun DB simpleHtml-adapter</title>
	<style>
		body {
			color: #303438;
			font-family: sans-serif;
			text-align: center;
		}
	</style>
</head>

<body>
	<h1>usable-gun DB simpleHtml Adapter</h1>
	<p>Open your web console</p>
	<script type="module">
			import { gunSpace } from "../../../usableLib/util/gunAdapter.js";

		// Self-executing function to encapsulate the main logic
		(async () => {
			// Get a reference to the 'data' node in the graph
			const path = 'data'
			const dataProperty = 'message'
			const gun = await gunSpace({
				gunOptions: {
					file: "usable-gun--Storage--" + path,
					localStorage: false
				}
			})

			// Periodically update the 'data' node with a timestamped message
			const updateInterval = 2000 // milliseconds
			setInterval(() => {
				const timestamp = new Date().toLocaleString()
				console.log("Updating " + dataProperty + ":", timestamp)
				// gun.pathPut(path, { message: `Hello world! ${timestamp}` })
				gun.pathPut(path + '.' + dataProperty, `Hello world! ${timestamp}`)
			}, updateInterval)

			// Subscribe to real-time updates on the 'message' field within the 'data' node
			gun.pathOn(path, (data) => {
				// Log the updated message to the console
				console.log("" + dataProperty + ":", data[dataProperty])
			})
			gun.pathOn(path + '.' + dataProperty, (data) => {
				// Log the updated message to the console
				console.log("" + dataProperty + ":", data[dataProperty])
			})
		})();

	</script>
</body>

</html>
